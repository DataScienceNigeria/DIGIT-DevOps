apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digit-complete-ingress
  namespace: egov
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  tls:
  - hosts:
    - certi-verse.com
    secretName: certi-verse-com-tls-certs
  rules:
  - host: certi-verse.com
    http:
      paths:
      # DIGIT UI (Main Application)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: digit-ui
            port:
              number: 80
      
      # Employee Portal
      - path: /employee
        pathType: Prefix
        backend:
          service:
            name: employee
            port:
              number: 80
      
      # Citizen Portal
      - path: /citizen
        pathType: Prefix
        backend:
          service:
            name: citizen
            port:
              number: 80
      
      # API Gateway
      - path: /gateway
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080
---
# Separate ingress for backbone services
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backbone-services-ingress
  namespace: backbone
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - admin.certi-verse.com
    secretName: admin-certi-verse-com-tls-certs
  rules:
  - host: admin.certi-verse.com
    http:
      paths:
      # Kibana Dashboard
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kibana-kibana
            port:
              number: 5601
      
      # MinIO Console
      - path: /minio
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              number: 9001
