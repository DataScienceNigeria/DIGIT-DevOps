# Gateway Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: egov
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: html
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: config
        configMap:
          name: gateway-config
      - name: html
        configMap:
          name: gateway-html
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: egov
spec:
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: egov
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        server {
            listen 8080;
            location / {
                root /usr/share/nginx/html;
                index index.html;
            }
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-html
  namespace: egov
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>DIGIT - API Gateway</title></head>
    <body style="font-family: Arial; margin: 50px; text-align: center;">
        <h1>🔗 DIGIT API Gateway</h1>
        <p>Backend API services and integrations</p>
        <p><em>Gateway services are being configured...</em></p>
        <a href="/">← Back to Main Portal</a>
    </body>
    </html>

