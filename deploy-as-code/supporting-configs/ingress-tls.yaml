apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: certi-verse-ingress
  namespace: backbone
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - certi-verse.com
    secretName: certi-verse-tls
  rules:
  - host: certi-verse.com
    http:
      paths:
      # Playground service (simple test app)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: playground
            port:
              number: 80
      
      # Kibana (if working)
      - path: /kibana
        pathType: Prefix
        backend:
          service:
            name: kibana-kibana
            port:
              number: 5601
      
      # MinIO Console
      - path: /minio
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              number: 9001