{{- with index .Values "secrets" "egov-enc-service" }}
apiVersion: v1
kind: Secret
metadata:
  # Adding default values for 'name' and 'namespace' is good practice,
  # in case they are not explicitly provided in 'secrets.egov-enc-service'.
  name: {{ .name | default "egov-enc-service-secret" }}
  namespace: {{ .namespace | default "default" }}
type: Opaque
data:
  # Applying | default "" to ensure b64enc always receives a string
  master.password: {{ .master_password | default "" | b64enc | quote }}
  master.salt: {{ .master_salt | default "" | b64enc | quote }}
  master.initialvector: {{ .master_initialvector | default "" | b64enc | quote }}
{{- end }}
