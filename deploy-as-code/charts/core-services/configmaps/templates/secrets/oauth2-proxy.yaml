# configmaps/templates/secrets/oauth2-proxy.yaml
# (Assuming this file is located at configmaps/templates/secrets/oauth2-proxy.yaml)

{{- with index .Values "secrets" "oauth2-proxy" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name | default "oauth2-proxy-secret" }} # Added default for name, in case it's missing from values
  namespace: {{ .namespace | default "default" }} # Added default for namespace, if not provided
type: Opaque
data:
  # Using | default "" to ensure b64enc always receives a string, even if the value is missing/nil
  cookie-secret: {{ .cookieSecret | default "" | b64enc | quote }}
  client-secret: {{ .clientSecret | default "" | b64enc | quote }}
  client-id: {{ .clientID | default "" | b64enc | quote }}
{{- end }}
