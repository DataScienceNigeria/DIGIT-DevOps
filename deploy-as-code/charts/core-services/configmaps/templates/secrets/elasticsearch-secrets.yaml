# configmaps/templates/secrets/elasticsearch-secrets.yaml

{{- with index .Values "secrets" "elasticsearch" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name | default "elasticsearch-secret" }} # Added default for name
  namespace: {{ .namespace | default "default" }} # Added default for namespace
type: Opaque
data:
  username: {{ "elastic" | b64enc }}
  # Using | default "" to ensure b64enc always receives a string, even if the value is missing/nil
  password: {{ .password | default "" | b64enc | quote }}
{{- end }}
