{{- with index .Values "secrets" "egov-filestore" }}
apiVersion: v1
kind: Secret
metadata:
  # Adding default values for 'name' and 'namespace' is good practice,
  # in case they are not explicitly provided in 'secrets.egov-filestore'.
  name: {{ .name | default "egov-filestore-secret" }}
  namespace: {{ .namespace | default "default" }}
type: Opaque
data:
  # Applying | default "" to ensure b64enc always receives a string
  awskey: {{ .awskey | default "" | b64enc | quote }}
  awssecretkey: {{ .awssecretkey | default "" | b64enc | quote }}
{{- end }}
