{{- with index .Values "secrets" "egov-pg-service" }}
{{- if gt (len .) 2 }}
apiVersion: v1
kind: Secret
metadata:
  # Adding default values for 'name' and 'namespace' is good practice,
  # in case they are not explicitly provided in 'secrets.egov-pg-service'.
  name: {{ .name | default "egov-pg-service-secret" }}
  namespace: {{ .namespace | default "default" }}
type: Opaque
data:
  # Applying | default "" to ensure b64enc always receives a string
  axismerchantid: {{ .axis_merchant_id | default "" | b64enc | quote }}
  axismerchantsecret: {{ .axis_merchant_secretkey | default "" | b64enc | quote }}
  axismerchantuser: {{ .axis_merchant_user | default "" | b64enc | quote }}
  axismerchantpwd: {{ .axis_merchant_pwd | default "" | b64enc | quote }}
  axismerchantaccesscode: {{ .axis_merchant_accesscode | default "" | b64enc | quote }}
  payumerchantkey: {{ .payu_merchant_key | default "" | b64enc | quote }}
  payumerchantsalt: {{ .payu_merchant_salt | default "" | b64enc | quote }}
{{- end }}
{{- end }}
