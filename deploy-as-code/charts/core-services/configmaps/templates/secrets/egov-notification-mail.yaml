{{- with index .Values "secrets" "egov-notification-mail" }}
apiVersion: v1
kind: Secret
metadata:
  # Adding default values for 'name' and 'namespace' is good practice,
  # in case they are not explicitly provided in 'secrets.egov-notification-mail'.
  name: {{ .name | default "egov-notification-mail-secret" }}
  namespace: {{ .namespace | default "default" }}
type: Opaque
data:
  # Applying | default "" to ensure b64enc always receives a string
  mailsenderusername: {{ .mailsenderusername | default "" | b64enc | quote }}
  mailsenderpassword: {{ .mailsenderpassword | default "" | b64enc | quote }}
{{- end }}
