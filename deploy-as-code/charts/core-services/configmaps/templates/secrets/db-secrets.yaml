{{- with index .Values "secrets" "db" }}
apiVersion: v1
kind: Secret
metadata:
  # Adding default values for 'name' and 'namespace' is good practice,
  # in case they are not explicitly provided in 'secrets.db'.
  name: {{ .name | default "db-secret" }}
  namespace: {{ .namespace | default "default" }}
type: Opaque
data:
  # Applying | default "" to ensure b64enc always receives a string
  username: {{ .username | default "" | b64enc | quote }}
  password: {{ .password | default "" | b64enc | quote }}
  flyway-username: {{ .flywayUsername | default "" | b64enc | quote }}
  flyway-password: {{ .flywayPassword | default "" | b64enc | quote }}
{{- end }}
