{{- with index .Values "secrets" "egov-notification-sms" }}
apiVersion: v1
kind: Secret
metadata:
  # Adding default values for 'name' and 'namespace' is good practice,
  # in case they are not explicitly provided in 'secrets.egov-notification-sms'.
  name: {{ .name | default "egov-notification-sms-secret" }}
  namespace: {{ .namespace | default "default" }}
type: Opaque
data:
  # Applying | default "" to ensure b64enc always receives a string
  username: {{ .username | default "" | b64enc | quote }}
  password: {{ .password | default "" | b64enc | quote }}
{{- end }}
