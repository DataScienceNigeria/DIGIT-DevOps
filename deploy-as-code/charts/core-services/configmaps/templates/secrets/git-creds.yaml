# configmaps/templates/secrets/git-creds.yaml

{{- with index .Values "secrets" "git-sync" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name | default "git-creds-secret" }} # Added default for name
  namespace: {{ .namespace | default "default" }} # Added default for namespace
type: Opaque
data:
  # Using | default "" to ensure b64enc always receives a string, even if the value is missing/nil
  ssh: {{ .ssh | default "" | b64enc | quote }}
  known_hosts: {{ .known_hosts | default "" | b64enc | quote }}
{{- end }}
