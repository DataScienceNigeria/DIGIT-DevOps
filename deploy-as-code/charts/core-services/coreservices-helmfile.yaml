# coreservices-helmfile.yaml

templates:
  default: &default
    # CORRECTED: Use Helmfile template syntax {{ .Name }} instead of Helm syntax
    chart: ../../helm/charts/common
    version: 0.1.0
    namespace: egov
    # This prevents helmfile exiting when it encounters a missing file
    # Valid values are "Error", "Warn", "Info", "Debug". The default is "Error"
    # Use "Debug" to make missing files errors invisible at the default log level(--log-level=INFO)
    missingFileHandler: Warn
    values:
      - ../environments/env-secrets.yaml
      - ../environments/env.yaml

releases:
  - name: egov-accesscontrol
    installed: true
    <<: *default

  - name: audit-service
    installed: true
    <<: *default

  - name: egov-enc-service
    installed: true
    needs:
    - egov-mdms-service
    <<: *default

  - name: egov-filestore
    installed: true
    <<: *default

  - name: egov-idgen
    installed: true
    <<: *default

  - name: egov-localization
    installed: true
    <<: *default

  - name: egov-location
    installed: true
    <<: *default

  - name: egov-mdms-service
    installed: true
    <<: *default

  - name: egov-hrms
    installed: true
    needs:
    - egov-user
    <<: *default

  - name: egov-indexer
    installed: true
    <<: *default

  - name: egov-notification-mail
    installed: true
    <<: *default

  - name: egov-notification-sms
    installed: true
    <<: *default

  - name: egov-user
    installed: true
    needs:
    - egov-enc-service
    <<: *default

  - name: egov-otp
    installed: true
    <<: *default

  - name: egov-persister
    installed: true
    <<: *default

  - name: egov-url-shortening
    installed: true
    <<: *default

  - name: egov-workflow-v2
    installed: true
    needs:
    - egov-mdms-service
    <<: *default

  - name: user-otp
    installed: true
    <<: *default

  - name: configmaps
    installed: true
    <<: *default

  - name: citizen
    installed: true
    <<: *default

  - name: digit-ui
    installed: true
    <<: *default

  - name: employee
    installed: true
    <<: *default

  - name: service-request
    installed: true
    <<: *default

  - name: pgr-services
    installed: true
    <<: *default

  - name: gateway
    installed: true
    <<: *default

  - name: egov-pg-service
    installed: true
    <<: *default

  - name: egov-user-event
    installed: true
    <<: *default
