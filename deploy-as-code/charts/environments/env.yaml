global:
  domain: certi-verse.com
gateway:
  rbac:
    create: true
  serviceAccount:
    create: true
    name: "gateway-service-account"
  # Add the missing image configuration
  image:
    repository: "egovio/gateway"
    tag: "spring-cloud-gateway-6df77bec7c-15"
    pullPolicy: "IfNotPresent"
  # Add other required gateway configurations
  replicas: 1
  httpPort: 8080
  healthChecks:
    enabled: true
    readinessProbePath: "/health"
    livenessProbePath: "/health"
  memory_limits: "768Mi"
  heap: "-Xmx512m -Xms512m"
  appType: "java-spring"
  tracing-enabled: true
  labels:
    app: "gateway"
    group: "gateway"
root-ingress:
  cert-issuer: "letsencrypt-prod"
configmaps:
  egov-config:
    data:
      db-host: digit-lts-dsn-db.c7mgi6o6wnw9.ap-south-1.rds.amazonaws.com
      db-name: digitltsdbdsn
      db-url: "jdbc:postgresql://digit-lts-dsn-db.c7mgi6o6wnw9.ap-south-1.rds.amazonaws.com:5432/digitltsdbdsn"
      es-host: "elasticsearch-data.backbone"
      es-indexer-host: "https://elasticsearch-data.backbone:9200/"
      # Primary Kafka configuration (will switch to this once Kafka is working)
      kafka-brokers: "kafka-kraft-controller-headless.backbone:9092"
      # Fallback Redis configuration
      spring.redis.host: "redis.backbone"
      spring.redis.port: "6379"
      spring.redis.timeout: "2000"
      spring.redis.database: "0"
      egov-services-fqdn-name: https://certi-verse.com/
      # Additional required configs
      egov-state-level-tenant-id: "in"
      state.level.tenant.id: "in"
      domain.url: "https://certi-verse.com"
      # Database connection pool settings
      spring.datasource.tomcat.max-active: "5"
      spring.datasource.tomcat.max-idle: "5"
      spring.datasource.tomcat.min-idle: "1"
egov-user:
  heap: "-Xmx256m -Xms256m"
  memory_limits: 512Mi
  billing-update-url: "{'PT':'http://internal-gateway-scg.egov:8080/pt-calculator-v2/propertytax/_updatedemand','WS':'http://internal-gateway-scg.egov:8080/ws-calculator/waterCalculator/_updateDemand','SW':'http://internal-gateway-scg.egov:8080/sw-calculator/sewerageCalculator/_updateDemand','TL':''}"
egov-url-shortening:
