# Add this at the end to ensure proper logging and monitoring
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
  level:
    root: "INFO"
    org.egov: "DEBUG"
    org.springframework.web: "DEBUG"
# Add Redis as fallback message broker configuration
redis:
  enabled: true
  host: "redis.backbone"
  port: 6379
  database: 0
  timeout: 2000
# Monitoring namespace configuration
namespace: monitoring
# Grafana configuration
grafana:
  adminPassword: "admin123" # Change this to a secure password
  persistence:
    enabled: true
    storageClassName: "gp2"
    size: "10Gi"
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - grafana.certi-verse.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.certi-verse.com
# Prometheus configuration
prometheus:
  prometheusSpec:
    retention: "30d"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "gp2"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "50Gi"
# Loki configuration
loki:
  persistence:
    enabled: true
    storageClassName: "gp2"
    size: "10Gi"
# Jaeger configuration
jaeger:
  storage:
    type: elasticsearch
    elasticsearch:
      host: "elasticsearch-data.backbone"
      port: 9200
      scheme: "http"
# Secrets configuration (add to env-secrets.yaml instead)
secrets:
  elasticsearch:
    password: "your-elasticsearch-password"
