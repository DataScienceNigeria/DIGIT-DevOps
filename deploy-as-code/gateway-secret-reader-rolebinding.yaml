# filename: gateway-secret-reader-rolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-secret-reader-rolebinding
  namespace: egov # Must be in the same namespace as the service account
subjects:
- kind: ServiceAccount
  name: gateway-service-account # Name of the service account used by your gateway deployment
  namespace: egov # Namespace of the service account
roleRef:
  kind: Role
  name: secret-reader-role # Name of the Role created in step 1
  apiGroup: rbac.authorization.k8s.io
